notes: 'Metadata from PubMed record PMID 19130998 (retrieved 2026-11-04); PDF from asecho.org. EAE is the predecessor of EACVI. The aortic stenosis part is updated by eacvi-ase-2017-aortic-stenosis, and ASE notes that its mitral stenosis classification is replaced by the 2014 AHA/ACC staging (not an allowed source), so only the tricuspid stenosis, pulmonary stenosis and Wilkins score sections are used.'
