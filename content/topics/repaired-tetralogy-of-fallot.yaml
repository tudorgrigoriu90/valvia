  - id: pr-pitfall
    type: note
    tag: METH
    title: Wide-open pulmonary regurgitation
    text: "With 'free' PR the flow is laminar and low-velocity, so colour Doppler can miss the jet; a short deceleration time with a long period of no or antegrade late-diastolic flow usually indicates severe PR."
    citation:
      source: ase-2014-repaired-tetralogy
      locator:
        page: '115'
