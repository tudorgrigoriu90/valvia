  - id: severe-pr
    type: threshold-list
    tag: CRIT
    title: Doppler predictors of significant or severe pulmonary regurgitation
    values:
      - parameter: pr-jet-width-percent-annulus
        context: diagnostic-criterion
        operator: '>='
        value: 50
        unit: '%'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Predicts severe PR together with diastolic flow reversal in the main or branch pulmonary arteries (colour or pulsed Doppler).
        citation:
          source: ase-2014-repaired-tetralogy
          locator:
            page: '115'
      - parameter: pr-jet-width-percent-annulus
        context: diagnostic-criterion
        operator: '>='
        value: 50
        unit: '%'
