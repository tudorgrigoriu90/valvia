  - id: surveillance
    type: note
    tag: METH
    title: Surveillance intervals
    text: 'Echocardiography every 12 months up to age 9 and every 24 months from age 10; CMR every 36 months in stable patients from age 10 (not routinely before), every 12 months with the thresholds above.'
