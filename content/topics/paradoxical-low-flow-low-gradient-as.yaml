id: paradoxical-low-flow-low-gradient-as
ref: '3.1.1.3'
slug: paradoxical-low-flow-low-gradient-as
title: 'Low-flow, low-gradient AS with preserved LVEF (paradoxical) and normal-flow low-gradient AS'
parent: aortic-stenosis
order: 2
population: adult
wave: W1
status: draft
blocks:
  - id: definition
    type: threshold-list
    tag: CRIT
    title: 'Paradoxical low-flow, low-gradient AS'
    values:
      - parameter: stroke-volume-index
        context: diagnostic-criterion
        operator: '<'
        value: 35
        unit: mL/m²
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'Low flow despite normal ejection fraction, with AVA < 1.0 cm² and mean gradient < 40 mmHg.'
        citation:
          source: eacvi-ase-2017-aortic-stenosis
          locator:
            page: '385'
  - id: likelihood
    type: threshold-list
    tag: CRIT
    title: 'Criteria that increase the likelihood of severe AS (AVA < 1.0 cm², mean gradient < 40 mmHg, preserved EF)'
