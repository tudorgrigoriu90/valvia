        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: pulmonary-vein-systolic-filling-fraction
        context: diagnostic-criterion
        operator: '<='
        value: 40
        unit: '%'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'Specific (88%).'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: e-over-e-prime-average
        context: diagnostic-criterion
        operator: '>'
        value: 14
        unit: '1'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'High specificity, low sensitivity. A predominant early filling pattern with depressed LVEF also suggests raised pressure; after premature beats, fused E and A may separate.'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
