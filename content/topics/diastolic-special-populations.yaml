      - parameter: e-srivr-ratio
        context: diagnostic-criterion
        operator: '<='
        value: 200
        unit: cm
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'For E/e′ between 7 and 14: mitral E / SRIVR (strain rate during isovolumic relaxation, three apical views) ≤ 200 cm is normal.'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: e-srivr-ratio
        context: diagnostic-criterion
        operator: '>'
        value: 200
        unit: cm
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'For E/e′ between 7 and 14: > 200 cm denotes elevated filling pressure.'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: tr-velocity
        context: diagnostic-criterion
        operator: '<='
        value: 2.8
        unit: m/s
        modality: Echo
        population:
          ageGroup: adult
        caveats:
