      - parameter: mitral-e-deceleration-time
        context: diagnostic-criterion
        operator: '<'
        value: 160
        unit: ms
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - In patients with depressed LVEF.
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: mitral-e-acceleration-rate
        context: diagnostic-criterion
        operator: '>='
        value: 1900
        unit: cm/s²
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'Peak acceleration rate of mitral E velocity (printed 1,900 cm/s²).'
        citation:
