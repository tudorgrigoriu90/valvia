  - id: ph
    type: threshold-list
    tag: CRIT
    title: 'Pulmonary hypertension: post- vs precapillary'
    values:
      - parameter: mitral-e-a-ratio
        context: diagnostic-criterion
        operator: '>='
        value: 2
        unit: '1'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Favours postcapillary PH.
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: mitral-e-a-ratio
        context: diagnostic-criterion
        operator: '<='
        value: 0.8
        unit: '1'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Favours precapillary PH.
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: e-over-e-prime-lateral
        context: diagnostic-criterion
        operator: '>'
        value: 13
        unit: '1'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'When E/A is > 0.8 but < 2: lateral E/e′ > 13, LA maximum volume index > 34 mL/m² and LA reservoir strain < 18% favour postcapillary PH.'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: la-volume-index
        context: diagnostic-criterion
        operator: '>'
        value: 34
        unit: mL/m²
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'With E/A > 0.8 but < 2, favours postcapillary PH (with the other two criteria).'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
      - parameter: la-reservoir-strain
        context: diagnostic-criterion
        operator: '<'
        value: 18
        unit: '%'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'With E/A > 0.8 but < 2, favours postcapillary PH (with the other two criteria).'
        citation:
          source: ase-2025-diastolic-function
          locator:
            table: '7'
            page: '557'
