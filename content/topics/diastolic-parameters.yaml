  - id: derivation
    type: note
    tag: METH
    title: How the ranges were derived
    text: 'Limits are the 5th and 95th percentiles from population studies of people free of cardiovascular disease and risk factors. Prognostically relevant changes can occur within these ranges, and LA volume index and LA strain also differ by measurement method and strain software vendor.'
