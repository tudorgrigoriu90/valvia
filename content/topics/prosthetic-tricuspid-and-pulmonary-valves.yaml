      - parameter: prosthetic-tricuspid-vti-ratio
        context: diagnostic-criterion
        operator: '>='
        value: 3.3
        unit: '1'
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Suggestive of prosthetic tricuspid stenosis.
          - Assessed in the absence of AR or TR; upper limits vary by valve size and type.
