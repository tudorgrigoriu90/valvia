  - id: integration
    type: note
    tag: METH
    title: How to use these thresholds
    text: 'Integrate several parameters; qualitative and semiquantitative signs that are specific for a grade carry most weight, and quantitative parameters subclassify moderate AR into grades II and III. Colour Doppler is usually performed at a Nyquist limit of 50–70 cm/s.'
    citation:
      source: ase-2017-native-regurgitation
