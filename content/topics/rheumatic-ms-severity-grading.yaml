  - id: ms-method
    type: note
    tag: METH
    title: Measurement
    text: Planimetry at the leaflet tips is the preferred method for the anatomic valve area (3D multiplanar guidance if needed; avoid excessive gain). Note rhythm and heart rate with Doppler; trace the mid-diastolic slope when the pressure half-time profile is bimodal. Pressure half-time is unreliable with significant MR and immediately after balloon valvotomy.
    citation:
      source: ase-2023-rheumatic-heart-disease
      locator:
        page: '8–9'
