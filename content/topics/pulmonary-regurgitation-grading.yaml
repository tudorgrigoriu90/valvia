  - id: integration
    type: note
    tag: METH
    title: How to use these thresholds
    text: 'Integrate valve morphology, RV size, colour and spectral Doppler signs; individual cut-offs have limited validation. CMR is currently the best method to quantify PR and follow it over time.'
