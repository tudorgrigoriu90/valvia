  - id: laa-assessment
    type: note
    tag: METH
    title: Assessment
    text: "Spontaneous echo contrast ('smoke') starts a continuum that progresses to sludge and thrombus. TEE is used to look for LA appendage thrombus, for example to guide cardioversion; 3D TEE adds perspective on appendage anatomy and helps tell real from artefactual masses."
    citation:
      source: ase-2016-cardiac-source-of-embolism
      locator:
        page: '10–13'
