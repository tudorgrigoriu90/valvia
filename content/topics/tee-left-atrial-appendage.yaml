blocks:
  - id: laa-velocity
    type: threshold-list
    tag: PROG
    title: LA appendage flow and thromboembolism
    values:
      - parameter: laa-peak-flow-velocity
        context: prognostic-marker
        operator: '<='
        value: 27
        unit: cm/s
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Associated with thromboembolic events in patients with atrial fibrillation (relative risk 1.7 in the cited trial substudy), as were LAA thrombus and aortic plaque.'
