  - id: interpretation
    type: note
    tag: METH
    title: Interpretation
    text: 'Significant stenosis should meet at least one flow-dependent parameter (velocity or mean gradient) and one flow-independent parameter (EOA or DVI). For SAVR, compare the EOA with the reference EOA for the model and size. For TAVI, compare mean gradient, DVI and EOA with the post-procedural baseline study.'
    citation:
      source: ase-2024-prosthetic-valves
      locator:
        table: '5'
        page: '19'
