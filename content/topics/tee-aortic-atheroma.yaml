        caveats:
          - 'Plaque in the ascending aorta or aortic arch visualised by TEE; strongly correlated with cerebral embolic events. Complex (mobile, ulcerated) atheroma is also associated with embolism.'
        citation:
          source: ase-2016-cardiac-source-of-embolism
