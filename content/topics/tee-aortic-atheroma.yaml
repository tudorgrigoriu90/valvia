  - id: views
    type: note
    tag: METH
    title: Views and blind spot
    text: 'Ascending aorta: midoesophageal long-axis (120–150°) and short-axis (30–60°) views; arch from upper oesophageal views; descending aorta in short and long axis. A short segment of the distal ascending aorta is a blind spot on TEE, and the abdominal aorta beyond the superior mesenteric artery cannot be seen; CT or MRI can fill these gaps.'
    citation:
      source: ase-2016-cardiac-source-of-embolism
      locator:
        page: '29'
