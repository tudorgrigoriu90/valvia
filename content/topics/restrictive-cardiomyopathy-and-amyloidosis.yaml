    title: Other strain patterns
    text: 'Regional patterns help the aetiological diagnosis of increased LV mass: septal impairment in classical HCM, apical impairment in apical HCM, predominantly basal-to-mid impairment in hypertensive heart disease and prominent apical sparing in amyloidosis; end-stage renal disease can mimic relative apical sparing.'
