          locator:
            table: '9'
            page: '467'
      - parameter: regurgitant-volume
        context: grading
        grade: Mild
        operator: '<'
        value: 30
        unit: mL
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Cut-offs need further validation.
        citation:
          source: ase-2019-regurgitation-after-percutaneous-interventions
          locator:
            table: '9'
            page: '467'
      - parameter: regurgitant-volume
