            page: '467'
  - id: residual-tr-note
    type: note
    tag: METH
    title: Qualitative signs
    text: 'Colour jet area, flow convergence, CW Doppler density and shape, tricuspid inflow and hepatic vein flow (systolic reversal = severe) complete the assessment; RV and RA size are no longer reliable after the intervention.'
    citation:
      source: ase-2019-regurgitation-after-percutaneous-interventions
      locator:
        table: '9'
        page: '467'
