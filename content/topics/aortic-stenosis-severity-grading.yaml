  - id: integration
    type: note
    tag: METH
    title: How to use these thresholds
    text: 'Any one of peak velocity of 4.0 m/s or more, mean gradient of 40 mmHg or more, or AVA below 1.0 cm² suggests severe AS; ideally all criteria agree. When they are discordant, integrate additional imaging findings and clinical data, and consider low-flow states (e.g. stroke volume index below 35 mL/m²). Record blood pressure, as hypertension alters velocity and gradient.'
    citation:
      source: eacvi-ase-2017-aortic-stenosis
      locator:
        page: '383'
