        value: 4
        unit: cm²
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - 'Usually; small central jet (or < 20% of LA area). Nyquist limit 50–60 cm/s.'
          - 'Best evaluated with TEE, particularly in mechanical valves.'
