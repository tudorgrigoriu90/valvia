  - id: anatomic-features
    type: criteria-checklist
    tag: FEAS
    title: 'Anatomic suitability for M-TEER: other features'
    criteria:
      - text: 'Optimal: pathology in A2/P2; no calcification; chord-free grasping zone; normal leaflet mobility and thickness.'
        category: favourable
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            figure: '2'
            page: '533'
      - text: 'Complex: pathology in A1/P1 or A3/P3; annular calcification without leaflet involvement; minimal chords in the grasping zone; excessive or normal leaflet mobility and thickness.'
        category: challenging
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            figure: '2'
            page: '533'
      - text: "Very complex: pathology involving multiple scallops; leaflet calcification outside the grasping zone; annuloplasty ring, previous single-leaflet device attachment or HCM; excessive or slightly restrictive mobility, Barlow's disease or increased leaflet thickness."
        category: challenging
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            figure: '2'
            page: '533'
      - text: 'Likely prohibitive (consider transcatheter replacement or alternatives): cleft or perforation; endocarditis; severe leaflet calcification in the grasping zone; severely calcified subvalvular apparatus including chords; rheumatic thickening and leaflet restriction.'
        category: unsuitable
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            figure: '2'
            page: '533'
