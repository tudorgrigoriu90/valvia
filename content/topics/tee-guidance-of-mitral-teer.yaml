  - id: before-deployment
    type: threshold-list
    tag: CRIT
    title: Before device deployment
    values:
      - parameter: mitral-mean-gradient
        context: diagnostic-criterion
        operator: '<'
        value: 5
        unit: mmHg
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Desirable baseline transmitral gradient (heart rate 60–80 beats/min), to minimise the risk of mitral stenosis.'
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '532'
      - parameter: mitral-valve-area
        context: diagnostic-criterion
        operator: '>='
        value: 4.0
        unit: cm²
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Desirable baseline MVA, ideally by 3D multiplanar planimetry at the leaflet tips.'
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '532'
      - parameter: mitral-valve-area
        context: diagnostic-criterion
        operator: '<'
        value: 3.5
        unit: cm²
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Often a contraindication to TEER; 3.5–4.0 cm² may be feasible depending on body size, the number and location of devices and operator experience.'
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '532'
      - parameter: mitral-mean-gradient
        context: diagnostic-criterion
        operator: '>'
        value: 5.0
        unit: mmHg
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Contraindication to screen for, unless believed to be secondary to MR.'
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '534'
  - id: leaflet-length-by-device
    type: note
    tag: METH
    title: Leaflet length by device
    text: 'The anterior and posterior leaflet lengths should measure at least 6.0 mm for a MitraClip NT/NTW device, 9 mm for a MitraClip XT/XTW device and at least 8 mm for a PASCAL device.'
    citation:
      source: ase-2026-m-teer-imaging
      locator:
        page: '532'
  - id: after-deployment
    type: threshold-list
    tag: CRIT
    title: After device deployment
    values:
      - parameter: mitral-mean-gradient
        context: diagnostic-criterion
        operator: '<'
        value: 5
        unit: mmHg
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - 'Residual gradient (CW Doppler); ideal, together with a residual MVA ≥ 2.0 cm². Interpret with heart rate and flow.'
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '547'
      - parameter: mitral-valve-area
        context: diagnostic-criterion
        operator: '>='
        value: 2.0
        unit: cm²
        modality: Echo
        technique: TEE
        population:
          ageGroup: adult
        caveats:
          - Residual MVA by 3D multiplanar planimetry (sum of the orifices); MVA by pressure half-time is not recommended.
        citation:
          source: ase-2026-m-teer-imaging
          locator:
            page: '547'
  - id: additional-device
    type: note
    tag: METH
    title: Additional device
    text: Deciding on another device weighs MR reduction against a rise in transmitral gradient; the goal is residual MR of mild or less with acceptably low gradients (below 5 mmHg in most cases). Many conventional MR indices are unreliable after TEER; use a multiparametric approach.
    citation:
      source: ase-2026-m-teer-imaging
      locator:
        page: '547–549'
