          source: ase-eacvi-2015-thoracic-aorta
          locator:
            table: '26'
            page: '164'
      - parameter: aortic-plaque-thickness
        context: grading
        grade: Severe (grade 4)
        operator: '>'
        value: 5
        unit: mm
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - No mobile or ulcerated components.
        citation:
          source: ase-eacvi-2015-thoracic-aorta
          locator:
            table: '26'
            page: '164'
  - id: complex-atheroma
    type: note
    tag: METH
    title: Complex atheroma (grade 5)
    text: 'Grade 2, 3 or 4 atheroma with mobile or ulcerated components is complex atheroma (grade 5).'
