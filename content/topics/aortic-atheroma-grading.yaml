    title: Severity of aortic atherosclerosis by atheroma thickness
    grades: ['Normal (grade 1)', 'Mild (grade 2)', 'Moderate (grade 3)', 'Severe (grade 4)']
    values:
      - parameter: aortic-plaque-thickness
        context: grading
        grade: Normal (grade 1)
        operator: '<'
        value: 2
        unit: mm
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Intimal thickness.
        citation:
          source: ase-eacvi-2015-thoracic-aorta
          locator:
            table: '26'
            page: '164'
      - parameter: aortic-plaque-thickness
        context: grading
        grade: Mild (grade 2)
        operator: range
        min: 2
        max: 3
        unit: mm
        modality: Echo
        population:
          ageGroup: adult
        caveats:
          - Focal or diffuse intimal thickening.
        citation:
          source: ase-eacvi-2015-thoracic-aorta
          locator:
            table: '26'
            page: '164'
      - parameter: aortic-plaque-thickness
        context: grading
        grade: Moderate (grade 3)
        operator: range
        min: 3
