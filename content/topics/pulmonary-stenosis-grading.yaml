  - id: measurement
    type: note
    tag: METH
    title: Measurement
    text: 'Use the highest velocity from several windows (parasternal short axis, subcostal, modified apical). With stenoses in series, for example subvalvular plus valvular, the simplified Bernoulli gradient cannot separate the contribution of each; estimate RV systolic pressure from the TR velocity as a cross-check.'
