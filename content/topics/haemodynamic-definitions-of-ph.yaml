    tag: METH
    title: Haemodynamic definitions (right heart catheterisation)
    text: 'PH: mean PA pressure > 20 mmHg. Precapillary PH: mPAP > 20 mmHg, PCWP ≤ 15 mmHg and PVR > 2 WU. Isolated postcapillary PH: mPAP > 20 mmHg, PCWP > 15 mmHg and PVR ≤ 2 WU. Combined pre- and postcapillary PH: mPAP > 20 mmHg, PCWP > 15 mmHg and PVR > 2 WU. Exercise PH: mPAP/cardiac output slope between rest and exercise > 3–3.5 mmHg·min/L. Echocardiography estimates probability; catheterisation remains essential for diagnosis and classification.'
