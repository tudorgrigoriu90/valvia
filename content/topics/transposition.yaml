  - id: systemic-rv-tr
    type: note
    tag: METH
    title: Interpretation with tricuspid regurgitation
    text: 'TAPSE, fractional area change and tissue Doppler velocities of the systemic right ventricle are all influenced by tricuspid regurgitation, which can increase annular motion and fractional area change and falsely suggest good function. CMR may be needed when RV dysfunction is suspected.'
    citation:
      source: ase-2016-transposition
      locator:
        page: '595'
