  - id: method
    type: note
    tag: METH
    title: Measurement
    text: Measure the echo-free space between parietal and visceral pericardium at end-diastole; an effusion seen only in systole is trivial. An evenly distributed effusion seen from several transducer positions makes the size estimate more reliable.
