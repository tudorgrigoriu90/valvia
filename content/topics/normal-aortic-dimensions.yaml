  - id: growth-with-age
    type: note
    tag: METH
    title: 'Age, sex and body size'
    text: 'Aortic root and ascending aortic diameters increase with age and body size; root diameters increase by about 0.9 mm per decade in men and 0.7 mm per decade in women. Endurance and strength training enlarge the root only slightly, so marked enlargement in an athlete suggests disease.'
    citation:
      source: ase-eacvi-2015-thoracic-aorta
      locator:
        page: '122–123'
