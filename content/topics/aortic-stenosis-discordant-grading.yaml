  - id: stepwise
    type: note
    tag: METH
    title: Stepwise approach
    text: 'When AVA indicates severe but velocity and gradient moderate AS: exclude measurement errors (especially LVOT underestimation), then define flow status. With normal flow (SVi ≥ 35 mL/m²) severe AS is very unlikely even if AVA is < 1 cm². With low flow, further evaluation depends on LVEF: low-dose dobutamine stress when reduced, the Table 5 criteria including the CT calcium score when preserved.'
    citation:
      source: eacvi-ase-2017-aortic-stenosis
      locator:
        page: '387'
