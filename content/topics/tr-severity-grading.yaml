  - id: integration
    type: note
    tag: METH
    title: How to use these thresholds
    text: 'Integrate several parameters; signs specific for a grade carry most weight. RV and RA size can be within the normal range in acute severe TR, and hepatic vein and tricuspid inflow patterns are nonspecific.'
    citation:
      source: ase-2017-native-regurgitation
      locator:
        figure: '31'
        page: '352'
  - id: algorithm
    type: algorithm-reference
    tag: ALG
    title: Algorithm for integrating multiple parameters of TR severity
