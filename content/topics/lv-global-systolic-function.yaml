    tag: METH
    title: Measurement
    text: 'LVEF is calculated from end-diastolic and end-systolic volumes by the biplane method of disks; 3D measurements are accurate and reproducible and should be used when available. LVEF below 52% in men and below 54% in women suggests abnormal LV systolic function.'
