  - id: residual-mr-integrative
    type: note
    tag: METH
    title: Integrative approach
    text: 'No single parameter suffices: weigh device position and stability, LA and LV size change from baseline, colour jets (number, eccentricity), flow convergence, pulmonary vein flow (systolic reversal = severe) and the CW Doppler signal, and interpret for body size and haemodynamics.'
    citation:
      source: ase-2019-regurgitation-after-percutaneous-interventions
      locator:
        table: '7'
        page: '457'
