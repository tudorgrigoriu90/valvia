          locator:
            table: '3'
            page: '179'
      - parameter: lv-systolic-eccentricity-index
        context: normal-range
        operator: '<='
        value: 1.3
        unit: '1'
        modality: Echo
        population:
          ageGroup: paediatric
        caveats:
          - Neonates in the NICU.
        citation:
          source: ase-2024-targeted-neonatal-echo
          locator:
            table: '3'
            page: '180'
      - parameter: rvet-to-paat-ratio
        context: normal-range
        operator: '<'
        value: 4
        unit: '1'
        modality: Echo
        population:
          ageGroup: paediatric
