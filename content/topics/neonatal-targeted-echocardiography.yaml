          source: ase-2024-targeted-neonatal-echo
          locator:
            table: '3'
            page: '181'
  - id: gestational-age
    type: note
    tag: METH
    title: Gestational-age dependent measurements
    text: 'Mitral E, A and E/A and TAPSE are gestational-age dependent; left and right ventricular outputs are normally 150–300 mL/min/kg. Aortic diastolic flow is normally absent, and coeliac and superior mesenteric artery flow antegrade throughout diastole.'
    citation:
      source: ase-2024-targeted-neonatal-echo
      locator:
        table: '3'
        page: '178–180'
  - id: pulmonary-hemodynamics
    type: threshold-list
    tag: CRIT
    title: Pulmonary haemodynamics
    values:
      - parameter: pda-right-to-left-flow
        context: diagnostic-criterion
        operator: '>='
        value: 60
        unit: '%'
        modality: Echo
        population:
          ageGroup: paediatric
        caveats:
          - 'Pulmonary artery pressure may be considered suprasystemic when 60% or more of transductal systolic flow is right to left.'
        citation:
          source: ase-2024-targeted-neonatal-echo
          locator:
            page: '177'
      - parameter: pulmonary-vein-velocity
        context: diagnostic-criterion
        operator: '>'
        value: 1.0
        unit: m/s
        modality: Echo
        population:
          ageGroup: paediatric
        caveats:
          - 'High pulmonary vein velocity: appraisal of all visualised pulmonary veins is mandatory in studies for bronchopulmonary dysplasia-associated pulmonary hypertension, with timely referral to a paediatric cardiologist.'
        citation:
          source: ase-2024-targeted-neonatal-echo
          locator:
            page: '188'
