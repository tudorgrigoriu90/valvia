      - parameter: paat-to-rvet-ratio
        context: normal-range
        operator: '<'
        value: 0.25
        unit: '1'
        modality: Echo
        population:
          ageGroup: paediatric
        caveats:
          - Pulmonary vascular resistance index; may be expressed as RVET/PAAT or PAAT/RVET.
          - Neonates in the NICU.
        citation:
          source: ase-2024-targeted-neonatal-echo
          locator:
            table: '3'
            page: '180'
      - parameter: branch-pa-diastolic-velocity
        context: normal-range
        operator: '<'
        value: 0.3
        unit: m/s
        modality: Echo
        population:
          ageGroup: paediatric
        caveats:
          - Normal diastolic velocity (high parasternal view); branch PA diastolic velocity may be used as an alternative marker of the ductal shunt.
          - Neonates in the NICU.
