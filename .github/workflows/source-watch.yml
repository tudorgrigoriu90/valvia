# Source watcher (EP-06, TS-06.1.1): weekly, finds new ESC/EACVI and ASE documents (PubMed) and errata of registered
# sources (Crossref), opens one issue per new candidate and commits the watcher state. On failure it opens (or comments
# on) a `watcher-failure` issue. Fetched metadata is untrusted: it reaches the shell only through files and quoted
# variables, never through ${{ }} expressions.
name: Source watch

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALVIA_SITE: ${{ vars.VALVIA_SITE || 'https://tudorgrigoriu90.github.io' }}
      VALVIA_BASE: ${{ vars.VALVIA_BASE || '/valvia/' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run watcher
        run: npx tsx pipeline/watch/cli.ts "$RUNNER_TEMP/watch"

      - name: Ensure labels
        run: |
          gh label create source-candidate --color 0E8A16 --description "Possible new or updated source (watcher)" 2>/dev/null || true
          gh label create erratum --color D93F0B --description "Correction notice for a registered source" 2>/dev/null || true
          gh label create watcher-failure --color B60205 --description "The source watcher failed" 2>/dev/null || true

      - name: Open one issue per candidate
        run: |
          jq -c '.[]' "$RUNNER_TEMP/watch/issues.json" | while read -r issue; do
            title=$(jq -r '.title' <<<"$issue")
            labels=$(jq -r '.labels | join(",")' <<<"$issue")
            jq -r '.body' <<<"$issue" > "$RUNNER_TEMP/watch/body.md"
            gh issue create --title "$title" --label "$labels" --body-file "$RUNNER_TEMP/watch/body.md"
            sleep 2
          done

      - name: Commit watcher state
        run: |
          if git diff --quiet -- pipeline/watch/state.json && git ls-files --error-unmatch pipeline/watch/state.json >/dev/null 2>&1; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/watch/state.json
          git commit -m "CH-watch: source watcher state $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Report failure
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create watcher-failure --color B60205 --description "The source watcher failed" 2>/dev/null || true
          open=$(gh issue list --label watcher-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Source watcher failed" --label watcher-failure \
              --body "The weekly source watcher failed: $RUN_URL. The state file was not updated if the run stopped before the commit, so the next run retries the same window. See docs/source-watchers.md."
          fi
