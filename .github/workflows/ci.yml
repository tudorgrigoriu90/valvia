# CI (TS-01.3.1): runs the same gate as `npm run verify` on every push to main and on every pull request.
# Deploy (TS-01.3.2, ADR 0002): after a green run on main, publishes dist/ to the gh-pages branch root,
# leaving PR previews in pr-preview/ untouched.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables override the defaults (e.g. VALVIA_BASE=/ once a custom domain is set, TS-08.2).
  VALVIA_SITE: ${{ vars.VALVIA_SITE || 'https://tudorgrigoriu90.github.io' }}
  VALVIA_BASE: ${{ vars.VALVIA_BASE || '/valvia/' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal links (docs and built site)
        run: npm run check:links -- --site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload site for deployment
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.VALVIA_SITE }}${{ env.VALVIA_BASE }}
    steps:
      - uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
          commit-message: 'deploy: ${{ github.sha }}'
