# CI (TS-01.3.1): runs the same gate as `npm run verify` on every push to main and on every pull request.
# Deploy (TS-01.3.2, ADR 0005): after a green run on main, deploys dist/ with GitHub's built-in Pages
# deployment (Pages source: GitHub Actions). No gh-pages branch. Pull requests get the built site as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables override the defaults (e.g. VALVIA_BASE=/ once a custom domain is set, TS-08.2).
  VALVIA_SITE: ${{ vars.VALVIA_SITE || 'https://tudorgrigoriu90.github.io' }}
  VALVIA_BASE: ${{ vars.VALVIA_BASE || '/valvia/' }}
  # Cookieless analytics (TS-07.5.1), off unless one is set (TS-08.5): GoatCounter site code or Cloudflare token.
  VALVIA_GOATCOUNTER: ${{ vars.VALVIA_GOATCOUNTER }}
  VALVIA_CF_BEACON_TOKEN: ${{ vars.VALVIA_CF_BEACON_TOKEN }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test

      - name: Validate content
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Internal links (docs and built site)
        run: npm run check:links -- --site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Lighthouse budgets
        run: npm run lighthouse

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload built site for pull request review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Settings → Pages → Source = GitHub Actions (docs/ci-cd.md).
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
