# Stale content PR reminders (TS-06.3.3): daily, comments on content PRs (branches content/… and source/…) idle for
# 7 days and labels those open for 14 days `review-overdue` once (pipeline/stale).
name: Stale content PRs

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    name: Remind and escalate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decide
        run: |
          gh pr list --state open --limit 200 --json number,headRefName,isDraft,createdAt,updatedAt,labels > "$RUNNER_TEMP/prs.json"
          npx tsx pipeline/stale/cli.ts "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/actions.json"
          cat "$RUNNER_TEMP/actions.json"

      - name: Act
        run: |
          gh label create review-overdue --color FBCA04 --description "Content PR waiting too long for review" 2>/dev/null || true
          jq -c '.[]' "$RUNNER_TEMP/actions.json" | while read -r action; do
            number=$(jq -r '.number' <<<"$action")
            jq -r '.comment' <<<"$action" > "$RUNNER_TEMP/comment.md"
            gh pr comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            label=$(jq -r '.label // empty' <<<"$action")
            if [ -n "$label" ]; then gh pr edit "$number" --add-label "$label"; fi
          done
