# Clinical change summary (TS-06.2.4): on every content PR, compares the PR's content with its base and posts the
# value-by-value summary (parameter, population, society, old → new, locator) as one comment that is updated on each
# push, and in the job summary. Read-only for fork PRs (no comment).
name: Content summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['content/**']

permissions:
  contents: read

concurrency:
  group: content-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    name: Clinical change summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out the base content
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: Build the summary
        run: |
          npx tsx pipeline/summary/cli.ts "$RUNNER_TEMP/base" . > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the summary comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          {
            echo '<!-- valvia-change-summary -->'
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo '_Generated from the YAML diff by `pipeline/summary` (TS-06.2.4). Check every row against the source document._'
          } > "$body"
          id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- valvia-change-summary -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$body"
          fi
